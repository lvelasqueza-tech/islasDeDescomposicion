<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto — Islas de Descomposición</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">Islas de Descomposición</a>
    <nav aria-label="Principal">
      <ul>
        <li><a href="index.html#texto">Texto</a></li>
        <li><a href="index.html#sliders">Sliders</a></li>
        <li><a href="contacto.html" aria-current="page">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="contacto" aria-labelledby="contacto-title">
      <h1 id="contacto-title">Contacto</h1>
      <form action="#" method="post">
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" type="text" required>

        <label for="email">Correo</label>
        <input id="email" name="email" type="email" required>

        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2027 Islas de Descomposición</p>
  </footer>
</body>
</html>
